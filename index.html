<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Work Log</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 text-gray-800">
  <div class="min-h-screen">
    <!-- Header -->
    <header class="bg-slate-800 text-white shadow-lg">
      <div class="max-w-7xl mx-auto px-4 py-6">
        <div class="flex items-center justify-between">
          <div>
            <h1 class="text-2xl font-bold">Work Log</h1>
            <p class="text-slate-300 text-sm mt-1">Personal work tracker</p>
          </div>
          <div class="text-right flex items-center gap-3">
            <button id="reload-btn" onclick="app.refreshData()" class="bg-slate-600 hover:bg-slate-500 text-white px-3 py-1.5 rounded text-sm transition-colors">Reload</button>
            <div id="total-hours-badge" class="bg-slate-700 px-4 py-2 rounded-lg">
              <span class="text-xs text-slate-300">Total Hours</span>
              <div id="total-hours" class="text-2xl font-bold">0</div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
      <!-- Stats Cards -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-white rounded-xl shadow p-4 border-l-4 border-blue-500">
          <div class="text-sm text-gray-500">Total Entries</div>
          <div id="stat-entries" class="text-2xl font-bold">0</div>
        </div>
        <div class="bg-white rounded-xl shadow p-4 border-l-4 border-green-500">
          <div class="text-sm text-gray-500">Total Hours</div>
          <div id="stat-hours" class="text-2xl font-bold">0</div>
        </div>
        <div class="bg-white rounded-xl shadow p-4 border-l-4 border-purple-500">
          <div class="text-sm text-gray-500">Categories</div>
          <div id="stat-categories" class="text-2xl font-bold">0</div>
        </div>
        <div class="bg-white rounded-xl shadow p-4 border-l-4 border-orange-500">
          <div class="text-sm text-gray-500">Avg Hours/Day</div>
          <div id="stat-avg" class="text-2xl font-bold">0</div>
        </div>
      </div>

      <!-- Controls -->
      <div class="bg-white rounded-xl shadow mb-6 p-4">
        <div class="flex flex-wrap gap-4 items-end">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Filter Category</label>
            <select id="filter-category" class="border rounded-lg px-3 py-2 w-40">
              <option value="">All Categories</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">From</label>
            <input type="date" id="filter-from" class="border rounded-lg px-3 py-2">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">To</label>
            <input type="date" id="filter-to" class="border rounded-lg px-3 py-2">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Search</label>
            <input type="text" id="filter-search" placeholder="Search tasks..." class="border rounded-lg px-3 py-2 w-48">
          </div>
          <button onclick="app.applyFilters()" class="bg-slate-800 text-white px-4 py-2 rounded-lg hover:bg-slate-700">Apply</button>
          <button onclick="app.clearFilters()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300">Clear</button>
        </div>
      </div>

      <!-- Calendar + Tasks Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">

        <!-- Calendar -->
        <div class="bg-white rounded-xl shadow p-4">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-lg font-bold">Calendar</h2>
            <div class="flex items-center gap-2">
              <button onclick="app.navigateCalendar(-1)" class="bg-gray-200 hover:bg-gray-300 px-2 py-1 rounded text-sm font-bold">&larr;</button>
              <span id="calendar-label" class="text-sm font-semibold w-28 text-center"></span>
              <button onclick="app.navigateCalendar(1)" class="bg-gray-200 hover:bg-gray-300 px-2 py-1 rounded text-sm font-bold">&rarr;</button>
            </div>
          </div>
          <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center text-sm"></div>
          <div class="flex gap-4 mt-2 text-xs text-gray-500">
            <span><span class="inline-block w-2.5 h-2.5 rounded-full bg-blue-500 align-middle mr-1"></span> Has entries</span>
            <span><span class="inline-block w-2.5 h-2.5 rounded-full bg-orange-400 align-middle mr-1"></span> Selected</span>
          </div>
        </div>

        <!-- Tasks -->
        <div class="bg-white rounded-xl shadow">
          <div class="p-4 border-b flex items-center justify-between">
            <h2 class="text-lg font-bold">Tasks</h2>
            <span id="task-count" class="text-sm text-gray-500">0 pending, 0 completed</span>
          </div>
          <div id="tasks-pending" class="divide-y">
            <div class="p-4">
              <h3 class="text-sm font-semibold text-gray-500 mb-2">Pending</h3>
              <div id="pending-tasks-list" class="space-y-2"></div>
            </div>
          </div>
          <div id="tasks-completed" class="divide-y border-t">
            <div class="p-4">
              <h3 class="text-sm font-semibold text-gray-500 mb-2">Completed</h3>
              <div id="completed-tasks-list" class="space-y-2"></div>
            </div>
          </div>
        </div>

      </div>

      <!-- Report Section -->
      <div class="bg-white rounded-xl shadow mb-6 p-4">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-bold">Reports</h2>
          <div class="flex gap-2">
            <button onclick="app.generateReport('weekly')" class="bg-blue-600 text-white px-3 py-1.5 rounded text-sm hover:bg-blue-700">Weekly</button>
            <button onclick="app.generateReport('monthly')" class="bg-green-600 text-white px-3 py-1.5 rounded text-sm hover:bg-green-700">Monthly</button>
            <button onclick="app.generateReport('custom')" class="bg-purple-600 text-white px-3 py-1.5 rounded text-sm hover:bg-purple-700">Custom Range</button>
            <button onclick="app.exportExcel()" class="bg-emerald-600 text-white px-3 py-1.5 rounded text-sm hover:bg-emerald-700">Export Excel</button>
            <button onclick="app.exportPDF()" class="bg-red-600 text-white px-3 py-1.5 rounded text-sm hover:bg-red-700">Export PDF</button>
          </div>
        </div>
        <div id="report-container" class="hidden">
          <div id="report-content" class="border rounded-lg p-4 bg-gray-50"></div>
        </div>
      </div>

      <!-- Charts -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
        <div class="bg-white rounded-xl shadow p-4">
          <h3 class="font-bold mb-4">Hours by Category</h3>
          <canvas id="category-chart"></canvas>
        </div>
        <div class="bg-white rounded-xl shadow p-4">
          <h3 class="font-bold mb-4">Hours Over Time</h3>
          <canvas id="timeline-chart"></canvas>
        </div>
      </div>

      <!-- Entries List -->
      <div class="bg-white rounded-xl shadow mt-6">
        <div class="p-4 border-b flex items-center justify-between">
          <h2 class="text-lg font-bold">Work Entries</h2>
          <span id="entry-count" class="text-sm text-gray-500">0 entries</span>
        </div>
        <div id="entries-list" class="divide-y">
          <div class="p-8 text-center text-gray-400">Loading entries...</div>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
